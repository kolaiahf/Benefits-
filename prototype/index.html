function useCountUp(target, dur = 950, run = true) {
    const [v, setV] = useState(run ? 0 : target);
    useEffect(() => {
        if (!run) {
            setV(target);
            return;
        }
        let raf, start;
        const tick = (t) => { if (!start)
            start = t; const p = Math.min((t - start) / dur, 1); setV(target * (1 - Math.pow(1 - p, 3))); if (p < 1)
            raf = requestAnimationFrame(tick); };
        raf = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(raf);
    }, [target, dur, run]);
    return v;
}
